<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FocusLog · Offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #F4F6F3; color: #1b1f23; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  @media (prefers-color-scheme: dark) { body { background: #101312; color: #e8efea; } p { color: #9aa49f !important; } }
  main { max-width: 320px; padding: 24px; text-align: center; }
  img { width: 56px; height: 56px; border-radius: 14px; }
  h1 { font-size: 20px; margin: 18px 0 6px; letter-spacing: -0.01em; }
  p { margin: 0 0 20px; color: #646b72; }
  button { font: inherit; font-weight: 600; color: #fff; background: #2D5F4F; border: 0; border-radius: 10px; padding: 10px 18px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1>You're offline</h1>
  <p>FocusLog needs the internet to load. A running timer is safe — it's kept on the server and will be right when you reconnect.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>window.addEventListener("online", () => location.reload());</script>
</body>
</html>
